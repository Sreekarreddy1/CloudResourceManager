name: build-windows

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: '6.8.*'
          host: windows
          target: desktop
          arch: win64_msvc2022_64
          modules: 'qtcharts'

      - name: Build
        shell: pwsh
        run: |
          cmake -S . -B build
          cmake --build build --config Release

      - name: Package
        shell: pwsh
        run: |
          mkdir dist
          Copy-Item build/Release/CloudResourceManager.exe dist/
          windeployqt --release dist/CloudResourceManager.exe

      - uses: actions/upload-artifact@v4
        with:
          name: CloudResourceManager-windows
          path: dist/